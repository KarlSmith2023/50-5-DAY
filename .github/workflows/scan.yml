: 50/5 daily scan

# 00:05 UTC — five minutes after the daily candle that produces signals closes.
# GitHub often runs scheduled jobs late, sometimes by up to an hour. That is
# harmless here: the bot only ever reads the last COMPLETED candle, so a late
# run produces exactly the same decision as a punctual one.
on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write           # needed to commit the forward record back

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PAPER MODE. No key is used, nothing is sent to any exchange.
      # This writes trades.csv and state.json.
      - name: Run the scan
        env:
          PAPER_EQUITY: '1000'
        run: python bot50_5.py --mode paper

      - name: Commit the forward record
        run: |
          git config user.name  "50-5-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "scan $(date -u +%F)"
          git push
