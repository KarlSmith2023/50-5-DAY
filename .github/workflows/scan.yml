name: 50/5 forward record

on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Record today's decisions
        run: python forward.py

      - name: Verify before publishing
        run: python forward.py --verify

      - name: Publish
        run: |
          git config user.name  "50-5-forward-record"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A forward
          git diff --staged --quiet || git commit -m "forward record $(date -u +%F)"
          git push
